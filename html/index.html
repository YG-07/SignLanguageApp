<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手语大闯关</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 600px;
      min-width: 1200px;
      height: 100vh;
      background: url('./assets/bg.jpg') no-repeat center center;
      background-size: cover;
      font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
      padding: 70px 110px 80px;
      display: flex;
      flex-direction: column;
    }

    /* 标题样式 - 无边框 */
    .title {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      color: #18a058;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      padding: 20px;
    }

    /* 主内容区域 */
    .main-content {
      display: flex;
      gap: 30px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* 毛玻璃效果 */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    /* 左侧关卡列表 */
    .level-list {
      width: 320px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .level-item:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateX(5px);
    }

    .level-item.active {
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(24, 160, 88, 0.3);
    }

    .level-item.locked {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .level-item.locked:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.5);
    }

    .level-name {
      font-size: 18px;
      font-weight: 500;
      color: #333;
    }

    /* 按钮基础样式 */
    .level-btn {
      height: 34px;
      border-radius: 34px;
      padding: 0 18px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    /* 已学习按钮 - 状态1 */
    .level-btn.learned {
      color: #18a058;
      background-color: rgba(24, 160, 88, 0.16);
      cursor: default;
    }

    /* 学会了按钮 - 状态0 */
    .level-btn.can-learn {
      color: #fff;
      background-color: #18a058;
    }

    .level-btn.can-learn:hover {
      opacity: 0.7;
    }

    /* 未学习文字 - 状态-1 */
    .not-learned-text {
      color: #999;
      font-size: 14px;
    }

    /* 右侧视频播放区 */
    .video-container {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .video-title {
      font-size: 20px;
      color: #18a058;
      margin-bottom: 15px;
      text-align: right;
      padding-right: 10px;
      flex-shrink: 0;
    }

    .video-player {
      flex: 1;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 15px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-player video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(0, 0, 0, 0.4);
    }

    .play-icon {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .play-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 25px solid rgba(0, 0, 0, 0.3);
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      margin-left: 8px;
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    /* 弹窗内容 - 毛玻璃效果 */
    .modal-content {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 60px 120px;
      text-align: center;
    }

    .modal-content img {
      max-width: 300px;
      margin-bottom: 30px;
    }

    .modal-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    .modal-btn {
      height: 34px;
      border-radius: 34px;
      padding: 0 24px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease;
    }

    .modal-btn.next {
      color: #fff;
      background-color: #18a058;
    }

    .modal-btn.next:hover {
      opacity: 0.7;
    }

    .modal-btn.close {
      color: #666;
      background-color: rgba(0, 0, 0, 0.1);
    }

    .modal-btn.close:hover {
      background-color: rgba(0, 0, 0, 0.15);
    }
  </style>
</head>

<body>
  <!-- 标题 -->
  <h1 class="title">手语大闯关</h1>

  <!-- 主内容区 -->
  <div class="main-content">
    <!-- 左侧关卡列表 -->
    <div class="level-list glass-panel">
      <div class="level-item" data-level="1" data-video="assets/01-帮助.mp4">
        <span class="level-name">手语第一关</span>
        <button class="level-btn can-learn" onclick="markLearned(1, event)">学会了</button>
      </div>
      <div class="level-item locked" data-level="2" data-video="assets/02-你.mp4">
        <span class="level-name">手语第二关</span>
        <span class="not-learned-text">未学习</span>
      </div>
      <div class="level-item locked" data-level="3" data-video="assets/03-好.mp4">
        <span class="level-name">手语第三关</span>
        <span class="not-learned-text">未学习</span>
      </div>
      <div class="level-item locked" data-level="4" data-video="assets/04-报警.mp4">
        <span class="level-name">手语第四关</span>
        <span class="not-learned-text">未学习</span>
      </div>
    </div>

    <!-- 右侧视频播放区 -->
    <div class="video-container glass-panel">
      <h2 class="video-title" id="videoTitle">请选择一个关卡开始学习</h2>
      <div class="video-player" id="videoPlayer">
        <div class="video-placeholder" id="placeholder">
          <div class="play-icon"></div>
          <p>点击左侧关卡播放视频</p>
        </div>
        <video id="video" controls style="display: none;"></video>
      </div>
    </div>
  </div>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <img src="assets/你真棒.gif" alt="你真棒">
      <div class="modal-buttons">
        <button class="modal-btn next" id="nextLevelBtn" onclick="goToNextLevel()">下一关</button>
        <button class="modal-btn close" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    // 视频名称映射
    const videoNames = {
      1: '帮助',
      2: '你',
      3: '好',
      4: '报警'
    };

    // 当前关卡
    let currentLevel = 0;

    // 从 localStorage 加载学习进度
    // 状态：1=已学习, 0=学会了(可点击), -1=未学习(隐藏按钮)
    function loadProgress() {
      const saved = localStorage.getItem('signLanguageProgress');
      return saved ? JSON.parse(saved) : { 1: 0, 2: -1, 3: -1, 4: -1 };
    }

    // 保存学习进度到 localStorage
    function saveProgress(progress) {
      localStorage.setItem('signLanguageProgress', JSON.stringify(progress));
    }

    // 初始化页面状态
    function initPage() {
      const progress = loadProgress();
      updateAllLevels(progress);
    }

    // 更新所有关卡状态
    function updateAllLevels(progress) {
      const levelItems = document.querySelectorAll('.level-item');

      levelItems.forEach((item, index) => {
        const level = index + 1;
        const state = progress[level];

        // 清除现有按钮/文字
        const existingBtn = item.querySelector('.level-btn');
        const existingText = item.querySelector('.not-learned-text');
        if (existingBtn) existingBtn.remove();
        if (existingText) existingText.remove();

        if (state === 1) {
          // 已学习状态
          item.classList.remove('locked');
          const btn = document.createElement('button');
          btn.className = 'level-btn learned';
          btn.textContent = '已学习';
          btn.onclick = (e) => e.stopPropagation();
          item.appendChild(btn);
        } else if (state === 0) {
          // 学会了状态（可点击）
          item.classList.remove('locked');
          const btn = document.createElement('button');
          btn.className = 'level-btn can-learn';
          btn.textContent = '学会了';
          btn.onclick = (e) => markLearned(level, e);
          item.appendChild(btn);
        } else {
          // 未学习状态（-1）
          item.classList.add('locked');
          const text = document.createElement('span');
          text.className = 'not-learned-text';
          text.textContent = '未学习';
          item.appendChild(text);
        }

        // 添加点击事件播放视频
        item.onclick = function (e) {
          if (e.target.tagName === 'BUTTON') return;
          if (item.classList.contains('locked')) {
            alert('请先完成前面的关卡！');
            return;
          }
          playVideo(level, item.dataset.video);
        };
      });
    }

    // 标记为已学习
    function markLearned(level, event) {
      event.stopPropagation();
      const progress = loadProgress();

      // 只有状态为0时才能点击
      if (progress[level] !== 0) {
        return;
      }

      // 更新当前关卡为已学习
      progress[level] = 1;

      // 解锁下一关（设为0）
      if (level < 4) {
        progress[level + 1] = 0;
      }

      saveProgress(progress);
      updateAllLevels(progress);

      // 记录当前关卡用于弹窗
      currentLevel = level;

      // 显示弹窗
      showModal(level);
    }

    // 显示弹窗
    function showModal(level) {
      const modal = document.getElementById('modal');
      const nextBtn = document.getElementById('nextLevelBtn');

      // 如果是最后一关，隐藏下一关按钮
      if (level >= 4) {
        nextBtn.style.display = 'none';
      } else {
        nextBtn.style.display = 'flex';
      }

      modal.classList.add('show');
    }

    // 关闭弹窗
    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('show');
    }

    // 前往下一关
    function goToNextLevel() {
      closeModal();

      if (currentLevel < 4) {
        const nextLevel = currentLevel + 1;
        const nextItem = document.querySelector(`[data-level="${nextLevel}"]`);
        playVideo(nextLevel, nextItem.dataset.video);
      }
    }

    // 播放视频
    function playVideo(level, videoSrc) {
      const video = document.getElementById('video');
      const placeholder = document.getElementById('placeholder');
      const videoTitle = document.getElementById('videoTitle');

      // 更新标题
      videoTitle.textContent = `正在学习：${videoNames[level]}`;

      // 隐藏占位符，显示视频
      placeholder.style.display = 'none';
      video.style.display = 'block';
      video.src = videoSrc;
      video.play();

      // 更新选中状态
      document.querySelectorAll('.level-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector(`[data-level="${level}"]`).classList.add('active');

      // 更新当前关卡
      currentLevel = level;
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>

</html>
